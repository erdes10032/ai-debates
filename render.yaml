databases:
  - name: ai-debates-db
    plan: free
    databaseName: ai_debates
    user: ai_debates

services:
  - type: web
    name: ai-debates-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/start-web.sh
    healthCheckPath: /
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-debates-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-debates-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: ai-debates-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_ADMIN
        sync: false

  - type: worker
    name: ai-debates-celery
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/start-celery.sh
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-debates-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-debates-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-debates-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: ai-debates-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_ADMIN
        sync: false

  - type: keyvalue
    name: ai-debates-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
